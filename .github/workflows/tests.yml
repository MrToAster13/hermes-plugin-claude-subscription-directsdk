name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Allow long paths (hermes-agent's i18n docs tree exceeds MAX_PATH)
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true
      - uses: actions/checkout@v4
        with:
          path: plugin
      # The plugin imports Hermes core (providers, agent) from a checkout, the way an installed plugin does.
      # Pinned to the hermes-agent commit the minipc container runs. Change this ref and
      # HERMES_SHA in hermes-mac-config docker/build-base.sh together, in the same day.
      # upstream-canary.yml runs the suite against upstream main on a schedule.
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: 3eb7ed08d19da393196722d0b219b2ba1ec22810
          path: hermes-agent
      # Hermes core gates every runtime dependency on python_version >= '3.14'; older Pythons install none of them.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install hermes-agent
        run: python -m pip install -e ./hermes-agent pytest
      - name: Run the plugin suite (real subprocess tree, real cancellation)
        working-directory: plugin
        env:
          HERMES_AGENT_REPO: ${{ github.workspace }}/hermes-agent
        run: python -m pytest -q
